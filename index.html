<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11121a">
  <title>声屿 — Music Player</title>

  <style>
    /* =====================================================================
       1. Design tokens and base styles
       ===================================================================== */
    :root {
      color-scheme: dark;
      --bg: #0d0f15;
      --panel: #151720;
      --panel-raised: #1a1c27;
      --line: #2b2e3b;
      --text: #f6f5fb;
      --muted: #9b9dac;
      --accent: #c3a7ff;
      --accent-soft: #d8c6ff;
      --radius: 20px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(ellipse at 82% -10%, #35264e66 0, transparent 35%),
        radial-gradient(ellipse at 0% 45%, #29203c30 0, transparent 35%),
        var(--bg);
    }

    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .app {
      width: min(100%, 1440px);
      margin: 0 auto;
      padding: 28px 36px 150px;
    }

    /* =====================================================================
       2. Header and language switch
       ===================================================================== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.6px;
    }

    .brand-mark {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid #ffffff20;
      border-radius: 13px;
      color: #211a30;
      background: linear-gradient(145deg, #e0d0ff, #a98bff);
      box-shadow: 0 5px 18px #9c7bea38;
    }

    .brand-mark .music-icon { width: 22px; height: 22px; }

    .pill-button {
      min-width: 48px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      background: #171923;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }

    .pill-button:hover {
      transform: translateY(-1px);
      border-color: #71658f;
      background: #222330;
    }

    .lang-button {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .07em;
    }

    /* =====================================================================
       3. Main layout, category navigation, and playlist hero
       ===================================================================== */
    .layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 28px;
    }

    .sidebar {
      position: sticky;
      top: 18px;
      height: max-content;
      padding: 18px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(155deg, #181a24ed, #12141bed);
      box-shadow: 0 18px 48px #00000020;
    }

    .side-label, .eyebrow {
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .side-label { margin: 3px 10px 12px; }

    .nav-item {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      padding: 12px 11px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--muted);
      background: none;
      text-align: left;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: color .18s ease, background .18s ease, border-color .18s ease;
    }

    .nav-item:hover { color: var(--text); background: #ffffff08; }
    .nav-item.active {
      border-color: #c3a7ff24;
      color: var(--text);
      background: linear-gradient(100deg, #c3a7ff1c, #c3a7ff08);
    }

    .nav-item.active .nav-icon { color: var(--accent-soft); }
    .nav-icon { display: grid; width: 20px; height: 20px; place-items: center; color: #858598; }
    .nav-icon .music-icon { width: 17px; height: 17px; }
    .music-icon { display: block; width: 24px; height: 24px; overflow: visible; }

    .main { min-width: 0; }

    /* =====================================================================
       4. Playlist heading, playback modes, and track rows
       ===================================================================== */
    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 2px 0 22px;
      padding: 3px 1px 0;
    }

    .section-head h2 {
      margin: 8px 0 0;
      font-size: clamp(24px, 2.4vw, 30px);
      line-height: 1.15;
      letter-spacing: -.8px;
    }

    .count {
      flex: none;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #c2c0ce;
      background: #151720;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .mode-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }

    .mode-button {
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #adafbe;
      background: #14161e;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: color .18s ease, border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .mode-button:hover { transform: translateY(-1px); color: var(--text); border-color: #5b526f; }
    .mode-button.active {
      border-color: #c3a7ff66;
      color: #e6dafa;
      background: #9c7bd322;
    }

    .tracks-panel {
      overflow: hidden;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(150deg, #171923f2, #13151df2);
      box-shadow: 0 18px 44px #00000018;
    }

    .track-head, .track {
      display: grid;
      grid-template-columns: 42px minmax(130px, 1fr) minmax(90px, .6fr) 58px;
      align-items: center;
      gap: 12px;
    }

    .track-head {
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      color: #9695a7;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .track {
      min-height: 66px;
      padding: 9px 8px;
      border-bottom: 1px solid #292b36;
      border-radius: 11px;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }

    .track:last-child { border-bottom: 0; }
    .track:hover { background: #ffffff08; }
    .track:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .track.playing { background: #c3a7ff0d; }
    .track.playing .track-title { color: var(--accent-soft); }
    .track-number { color: #898b9b; font-size: 11px; font-variant-numeric: tabular-nums; text-align: center; }
    .track.playing .track-number { color: var(--accent-soft); }

    .track-art {
      display: grid;
      width: 42px;
      height: 42px;
      grid-row: 1 / 3;
      place-items: center;
      border: 1px solid #ffffff12;
      border-radius: 11px;
      color: #eee6ff;
      background: linear-gradient(145deg, #77649e, #342b45);
    }

    .track:nth-child(3n) .track-art { background: linear-gradient(145deg, #956a7d, #3f2d3b); }
    .track:nth-child(4n) .track-art { background: linear-gradient(145deg, #547c89, #283b43); }
    .track-art .music-icon { width: 19px; height: 19px; }
    .track-info { display: grid; min-width: 0; grid-template-columns: 42px minmax(0, 1fr); grid-template-rows: auto auto; align-items: center; column-gap: 11px; }
    .track-title, .track-artist, .track-file { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .track-title { font-size: 13px; font-weight: 680; }
    .track-artist { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .track-file { color: #a9aab9; font-size: 11px; }
    .track-duration { color: #aeb0bd; font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; }

    .empty-state {
      padding: 52px 18px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
    }

    .empty-state strong { display: block; margin-bottom: 6px; color: var(--text); font-size: 15px; }

    /* =====================================================================
       5. Fixed audio player and range controls
       ===================================================================== */
    .bottom-player {
      position: fixed;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(280px, 1.4fr) minmax(130px, 1fr);
      align-items: center;
      gap: 20px;
      padding: 12px max(28px, calc((100vw - 1372px) / 2));
      border-top: 1px solid #ffffff14;
      background: #101119f2;
      box-shadow: 0 -14px 40px #00000028;
      backdrop-filter: blur(18px);
    }

    .now-playing { display: flex; min-width: 0; align-items: center; gap: 12px; }

    .cover-art {
      display: grid;
      width: 46px;
      height: 46px;
      flex: none;
      place-items: center;
      border: 1px solid #ffffff18;
      border-radius: 13px;
      color: #f0e9ff;
      background: linear-gradient(145deg, #8b75b5, #342b45);
      box-shadow: inset 0 1px 0 #ffffff18;
    }

    .cover-art .music-icon { width: 22px; height: 22px; }

    .now-meta { min-width: 0; }
    .now-title { overflow: hidden; font-size: 12px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .now-artist { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .player-center { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .player-controls { display: flex; align-items: center; gap: 18px; }

    .control-button {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 10px;
      color: #b7b6c4;
      background: transparent;
      font-size: 16px;
      cursor: pointer;
      transition: color .18s ease, background .18s ease;
    }

    .control-button svg { display: block; width: 55%; height: 55%; }
    .control-button:hover, .control-button.on { color: var(--accent-soft); background: #c3a7ff12; }

    .play-button {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      padding-left: 3px;
      border: 0;
      border-radius: 50%;
      color: #211b2b;
      background: #f5f1ff;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 4px 14px #c3a7ff36;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }

    .play-button:hover { transform: scale(1.05); background: var(--accent-soft); }

    .progress-row {
      display: grid;
      width: 100%;
      grid-template-columns: 35px 1fr 35px;
      align-items: center;
      gap: 9px;
      color: #a09eae;
      font-size: 9px;
      font-variant-numeric: tabular-nums;
    }

    .time:last-child { text-align: right; }

    .range {
      width: 100%;
      height: 4px;
      border-radius: 5px;
      outline: none;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--progress, 0%), #414150 var(--progress, 0%), #414150 100%);
      appearance: none;
      cursor: pointer;
    }

    .range::-webkit-slider-thumb {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #f1eaff;
      box-shadow: 0 0 0 2px #171720;
      appearance: none;
    }

    .range::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: #f1eaff; }
    .volume-area { display: flex; align-items: center; justify-content: flex-end; gap: 10px; color: #aeb0bf; }
    .volume-area .range { max-width: 100px; }
    .volume-icon { display: block; width: 18px; height: 18px; flex: none; }

    .toast {
      position: fixed;
      z-index: 20;
      bottom: 110px;
      left: 50%;
      padding: 11px 16px;
      transform: translate(-50%, 10px);
      border-radius: 999px;
      color: #261d36;
      background: #e9e1ff;
      font-size: 12px;
      font-weight: 750;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
    }

    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    /* =====================================================================
       6. Responsive layouts
       ===================================================================== */
    @media (max-width: 850px) {
      .app { padding: 22px 24px 145px; }
      .layout { grid-template-columns: 1fr; gap: 18px; }
      .sidebar { position: static; display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 9px; scrollbar-width: none; }
      .sidebar::-webkit-scrollbar { display: none; }
      .side-label { display: none; }
      .nav-item { width: auto; flex: 1 0 auto; justify-content: center; padding: 10px 14px; white-space: nowrap; }
      .bottom-player { grid-template-columns: minmax(0, 1fr) minmax(250px, 1.2fr); gap: 10px; padding: 11px 20px; }
      .volume-area { display: none; }
    }

    @media (max-width: 560px) {
      .app { padding: 16px 14px 210px; }
      .topbar { margin-bottom: 18px; }
      .brand { font-size: 18px; }
      .brand-mark { width: 35px; height: 35px; }
      .pill-button { padding: 8px 12px; }
      .section-head { margin-bottom: 17px; }
      .section-head h2 { font-size: 23px; }
      .count { padding: 6px 9px; font-size: 10px; }
      .mode-row { gap: 6px; }
      .mode-button { padding: 8px 10px; font-size: 10px; }
      .tracks-panel { padding: 5px 9px; }
      .track-head, .track { grid-template-columns: 25px minmax(0, 1fr) 42px; gap: 7px; }
      .track-head .file-column, .track .track-file { display: none; }
      .track { padding: 9px 3px; }
      .track-info { grid-template-columns: 36px minmax(0, 1fr); column-gap: 9px; }
      .track-art { width: 36px; height: 36px; }
      .track-title { font-size: 12px; }
      .track-artist, .track-duration { font-size: 10px; }
      .track-head { font-size: 8px; }
      .bottom-player { grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px)); }
      .now-playing { grid-column: 1; grid-row: 1; gap: 9px; }
      .cover-art { width: 38px; height: 38px; }
      .now-title { font-size: 11px; }
      .now-artist { font-size: 9px; }
      .player-center { display: contents; }
      .player-controls { grid-column: 1; grid-row: 2; justify-content: space-between; gap: 0; width: 100%; max-width: 380px; margin: 0 auto; }
      .control-button { width: 54px; height: 54px; border-radius: 16px; }
      .play-button { width: 64px; height: 64px; padding-left: 4px; font-size: 24px; }
      .progress-row { grid-column: 1; grid-row: 3; gap: 9px; margin-top: 2px; font-size: 11px; }
      .range { height: 6px; }
      .range::-webkit-slider-thumb { width: 18px; height: 18px; }
      .range::-moz-range-thumb { width: 18px; height: 18px; }
      .toast { bottom: 200px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header: product identity and interface-language toggle. -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg class="music-icon" viewBox="0 0 24 24" focusable="false">
            <path d="M9 18V5l12-2v13M9 9l12-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            <circle cx="6" cy="18" r="3" fill="currentColor"></circle>
            <circle cx="18" cy="16" r="3" fill="currentColor"></circle>
          </svg>
        </div>
        <div>声屿</div>
      </div>
      <button class="pill-button lang-button" id="langToggle" type="button" aria-label="Switch language">EN</button>
    </header>

    <div class="layout">
      <!-- The category values here match SONGS[].category below. -->
      <aside class="sidebar" aria-label="Music categories">
        <div class="side-label" data-i18n="library">你的音乐</div>
        <button class="nav-item active" type="button" data-category="all">
          <span class="nav-icon" aria-hidden="true"><svg class="music-icon" viewBox="0 0 24 24" focusable="false"><path d="M9 18V5l12-2v13M9 9l12-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="6" cy="18" r="3" fill="currentColor"></circle><circle cx="18" cy="16" r="3" fill="currentColor"></circle></svg></span><span data-i18n="all">全部混合</span>
        </button>
        <button class="nav-item" type="button" data-category="mandarin">
          <span class="nav-icon" aria-hidden="true"><svg class="music-icon" viewBox="0 0 24 24" focusable="false"><path d="M9 18V5l12-2v13M9 9l12-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="6" cy="18" r="3" fill="currentColor"></circle><circle cx="18" cy="16" r="3" fill="currentColor"></circle></svg></span><span data-i18n="mandarin">中文</span>
        </button>
        <button class="nav-item" type="button" data-category="cantonese">
          <span class="nav-icon" aria-hidden="true"><svg class="music-icon" viewBox="0 0 24 24" focusable="false"><path d="M9 18V5l12-2v13M9 9l12-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="6" cy="18" r="3" fill="currentColor"></circle><circle cx="18" cy="16" r="3" fill="currentColor"></circle></svg></span><span data-i18n="cantonese">粤语</span>
        </button>
        <button class="nav-item" type="button" data-category="english">
          <span class="nav-icon" aria-hidden="true"><svg class="music-icon" viewBox="0 0 24 24" focusable="false"><path d="M9 18V5l12-2v13M9 9l12-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="6" cy="18" r="3" fill="currentColor"></circle><circle cx="18" cy="16" r="3" fill="currentColor"></circle></svg></span><span data-i18n="english">英语歌曲</span>
        </button>
      </aside>

      <main class="main">
        <!-- Track list and playback-mode controls. -->
        <div class="section-head">
          <div>
            <div class="eyebrow" id="categoryLabel">全部混合歌单</div>
            <h2 data-i18n="playlist">全部曲目</h2>
          </div>
          <div class="count" id="trackCount">0 首歌曲</div>
        </div>

        <div class="mode-row" role="group" aria-label="Playback mode">
          <button class="mode-button active" type="button" data-mode="all" data-i18n="modeAll">顺序播放</button>
          <button class="mode-button" type="button" data-mode="one" data-i18n="modeOne">单曲循环</button>
          <button class="mode-button" type="button" data-mode="shuffle" data-i18n="modeShuffle">随机播放</button>
        </div>

        <section class="tracks-panel" aria-label="Song list">
          <div class="track-head">
            <span>#</span>
            <span data-i18n="titleArtist">歌曲</span>
            <span class="file-column" data-i18n="file">文件</span>
            <span style="text-align:right" aria-label="Duration">◷</span>
          </div>
          <div id="trackList"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- Persistent player: previous/play/next, modes, seek, and volume. -->
  <footer class="bottom-player" aria-label="Audio player">
    <div class="now-playing">
      <div class="cover-art" aria-hidden="true">
        <svg class="music-icon" viewBox="0 0 24 24" focusable="false">
          <path d="M9 18V5l12-2v13M9 9l12-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="6" cy="18" r="3" fill="currentColor"></circle>
          <circle cx="18" cy="16" r="3" fill="currentColor"></circle>
        </svg>
      </div>
      <div class="now-meta">
        <div class="now-title" id="nowTitle">—</div>
        <div class="now-artist" id="nowArtist" data-i18n="ready">选择一首歌曲开始聆听</div>
      </div>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button class="control-button" id="shuffleBtn" type="button" aria-label="Shuffle" title="Shuffle"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg></button>
        <button class="control-button" id="prevBtn" type="button" aria-label="Previous track"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20 9 12l10-8z" fill="currentColor"/><path d="M5 19V5"/></svg></button>
        <button class="play-button" id="playBtn" type="button" aria-label="Play">▶</button>
        <button class="control-button" id="nextBtn" type="button" aria-label="Next track"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8z" fill="currentColor"/><path d="M19 5v14"/></svg></button>
        <button class="control-button" id="repeatBtn" type="button" aria-label="Repeat" title="Repeat"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></svg></button>
      </div>
      <div class="progress-row">
        <span class="time" id="currentTime">0:00</span>
        <input class="range" id="seek" type="range" min="0" max="100" value="0" aria-label="Seek in track">
        <span class="time" id="duration">0:00</span>
      </div>
    </div>

    <div class="volume-area">
      <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">

      // English Song
		 { title: "Lemon Tree", artist: "Fool's Garden", category: "english", src: "Lemon Tree.mp3", volumeLevel: 0},

		 { title: "Memories", artist: "Maroon 5", category: "english", src: "Memories.mp3", volumeLevel: 0},
		 { title: "Payphone", artist: "Maroon 5", category: "english", src: "Payphone.mp3", volumeLevel: 0},
		 { title: "See You Again", artist: "Wiz Khalifa", category: "english", src: "See You Again.mp3", volumeLevel: 0},
		 { title: "Faded", artist: "Alan Walker", category: "english", src: "Faded.mp3", volumeLevel: 0},
		 { title: "Way Back Home", artist: "SHAUN feat. Conor Maynard", category: "english", src: "Way Back Home.mp3", volumeLevel: 0},
		 { title: "Believer", artist: "Imagine Dragons", category: "english", src: "Believer.mp3", volumeLevel: 0},

    ];

    /* =====================================================================
       Translations
       ===================================================================== */
    const TEXT = {
      zh: {
        library: "你的音乐",
        all: "全部混合",
        mandarin: "中文",
        cantonese: "粤语",
        english: "英语",
        playlist: "全部曲目",
        modeAll: "顺序播放",
        modeOne: "单曲循环",
        modeShuffle: "随机播放",
        titleArtist: "歌曲",
        file: "文件",
        ready: "选择一首歌曲开始聆听",
        emptyTitle: "这里还没有歌曲",
        emptyHint: "添加到这个分类的歌曲会显示在这里。",
        categoryLabels: { all: "全部混合歌单", mandarin: "中文歌单", cantonese: "粤语歌单", english: "英语歌单" },
        count: count => `${count} 首歌曲`,
        unknownArtist: "未知艺人",
        noSongs: "当前分类还没有歌曲。",
        playbackError: "无法播放此音频文件。"
      },
      en: {
        library: "YOUR LIBRARY",
        all: "All Mixed",
        mandarin: "Chinese",
        cantonese: "Cantonese",
        english: "English",
        playlist: "All tracks",
        modeAll: "Play in order",
        modeOne: "Repeat one",
        modeShuffle: "Shuffle",
        titleArtist: "Songs",
        file: "FILE",
        ready: "Choose a track to start listening",
        emptyTitle: "No tracks yet",
        emptyHint: "Songs in this category will show up here.",
        categoryLabels: { all: "All mixed playlist", mandarin: "Chinese playlist", cantonese: "Cantonese playlist", english: "English playlist" },
        count: count => `${count} ${count === 1 ? "song" : "songs"}`,
        unknownArtist: "Unknown artist",
        noSongs: "There are no tracks in this category yet.",
        playbackError: "This audio file could not be played."
      }
    };

    /* =====================================================================
       Player state and DOM references
       ===================================================================== */
    const audio = document.getElementById("audio");
    const trackList = document.getElementById("trackList");
    const trackCatalog = SONGS.map((song, index) => ({ ...song, id: String(index), duration: 0 }));

    let interfaceLanguage = "zh";
    let activeCategory = "all";
    let playbackMode = "all";
    let currentTrackIndex = -1;
    let toastTimeout;

    // Web Audio lets individual tracks be boosted above the normal 0–1
    // HTMLAudioElement volume range. The master slider remains the overall
    // volume control, while each song's volumeLevel applies a relative gain.
    let audioContext = null;
    let audioSourceNode = null;
    let masterGainNode = null;
    let masterVolume = 0.8;

    function ensureAudioGraph() {
      if (audioContext) return true;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return false;
        audioContext = new AudioContextClass();
        audioSourceNode = audioContext.createMediaElementSource(audio);
        masterGainNode = audioContext.createGain();
        audioSourceNode.connect(masterGainNode);
        masterGainNode.connect(audioContext.destination);
        return true;
      } catch (err) {
        audioContext = null;
        return false;
      }
    }

    function applyTrackVolume() {
      const track = trackCatalog[currentTrackIndex];
      const level = track ? Number(track.volumeLevel) || 0 : 0;
      const trackMultiplier = Math.pow(1.2, level);

      // Only switch to Web Audio when a track really needs a boost (>100%).
      // Routing audio through Web Audio can make local/file:// audio silent,
      // so normal tracks keep using the plain audio.volume property.
      if (!audioContext && trackMultiplier > 1) ensureAudioGraph();

      if (audioContext && masterGainNode) {
        audio.volume = 1;
        masterGainNode.gain.setTargetAtTime(
          masterVolume * trackMultiplier, audioContext.currentTime, 0.03);
        if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
      } else {
        audio.volume = Math.min(1, masterVolume * trackMultiplier);
      }
    }

    const text = () => TEXT[interfaceLanguage];
    const tracksInActiveCategory = () => trackCatalog
      .map((track, index) => ({ track, index }))
      .filter(item => activeCategory === "all" || item.track.category === activeCategory);

    /* =====================================================================
       Rendering helpers
       ===================================================================== */
    function escapeHTML(value) {
      const entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
      return String(value).replace(/[&<>"']/g, character => entities[character]);
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      const minutes = Math.floor(seconds / 60);
      const remainder = String(Math.floor(seconds % 60)).padStart(2, "0");
      return `${minutes}:${remainder}`;
    }

    function renderTrackList() {
      const items = tracksInActiveCategory();
      document.getElementById("categoryLabel").textContent = text().categoryLabels[activeCategory];
      document.getElementById("trackCount").textContent = text().count(items.length);

      if (items.length === 0) {
        trackList.innerHTML = `
          <div class="empty-state">
            <strong>${text().emptyTitle}</strong>
            ${text().emptyHint}
          </div>`;
        return;
      }

      trackList.innerHTML = items.map(({ track, index }, displayIndex) => {
        const isCurrent = index === currentTrackIndex;
        const marker = isCurrent && !audio.paused ? "▶" : String(displayIndex + 1).padStart(2, "0");
        const artist = track.artist || text().unknownArtist;

        return `
          <div class="track ${isCurrent ? "playing" : ""}" data-index="${index}" tabindex="0" role="button" aria-label="Play ${escapeHTML(track.title)}">
            <div class="track-number">${marker}</div>
            <div class="track-info">
              <span class="track-art" aria-hidden="true"><svg class="music-icon" viewBox="0 0 24 24" focusable="false"><path d="M9 18V5l12-2v13M9 9l12-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="6" cy="18" r="3" fill="currentColor"></circle><circle cx="18" cy="16" r="3" fill="currentColor"></circle></svg></span>
              <div class="track-title">${escapeHTML(track.title)}</div>
              <div class="track-artist">${escapeHTML(artist)}</div>
            </div>
            <div class="track-file">${escapeHTML(track.src)}</div>
            <div class="track-duration">${formatTime(track.duration)}</div>
          </div>`;
      }).join("");

      trackList.querySelectorAll(".track").forEach(row => {
        const startTrack = () => playTrack(Number(row.dataset.index));
        row.addEventListener("click", startTrack);
        row.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            startTrack();
          }
        });
      });
    }

    function renderInterface() {
      document.documentElement.lang = interfaceLanguage === "zh" ? "zh-CN" : "en";
      document.querySelectorAll("[data-i18n]").forEach(element => {
        element.innerHTML = text()[element.dataset.i18n];
      });
      document.getElementById("langToggle").textContent = interfaceLanguage === "zh" ? "EN" : "中文";

      document.querySelectorAll("[data-category]").forEach(button => {
        button.classList.toggle("active", button.dataset.category === activeCategory);
      });
      document.querySelectorAll("[data-mode]").forEach(button => {
        button.classList.toggle("active", button.dataset.mode === playbackMode);
      });

      renderTrackList();
      updatePlayerDisplay();
    }

    function updatePlayerDisplay() {
      const track = trackCatalog[currentTrackIndex];
      document.getElementById("nowTitle").textContent = track ? track.title : "—";
      document.getElementById("nowArtist").textContent = track
        ? (track.artist || text().unknownArtist)
        : text().ready;
      document.getElementById("playBtn").textContent = audio.paused ? "▶" : "Ⅱ";
      document.getElementById("repeatBtn").classList.toggle("on", playbackMode === "one");
      document.getElementById("shuffleBtn").classList.toggle("on", playbackMode === "shuffle");
    }

    function updateProgress() {
      const progress = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      const seek = document.getElementById("seek");
      seek.value = progress;
      seek.style.setProperty("--progress", `${progress}%`);
      document.getElementById("currentTime").textContent = formatTime(audio.currentTime);
      document.getElementById("duration").textContent = formatTime(audio.duration);
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(toastTimeout);
      toastTimeout = window.setTimeout(() => toast.classList.remove("show"), 2300);
    }

    /* =====================================================================
       Playback actions
       ===================================================================== */
    function playTrack(index) {
      if (index < 0 || index >= trackCatalog.length) return;

      currentTrackIndex = index;
      applyTrackVolume();
      audio.src = trackCatalog[index].src;
      audio.load();
      updatePlayerDisplay();
      renderTrackList();

      audio.play().catch(() => showToast(text().playbackError));
    }

    function getActiveTrackIndexes() {
      return tracksInActiveCategory().map(item => item.index);
    }

    function playNext() {
      const indexes = getActiveTrackIndexes();
      if (indexes.length === 0) return;

      if (playbackMode === "one" && currentTrackIndex >= 0) {
        audio.currentTime = 0;
        audio.play();
        return;
      }

      let nextIndex;
      if (playbackMode === "shuffle" && indexes.length > 1) {
        const choices = indexes.filter(index => index !== currentTrackIndex);
        nextIndex = choices[Math.floor(Math.random() * choices.length)];
      } else {
        const currentPosition = indexes.indexOf(currentTrackIndex);
        nextIndex = indexes[(currentPosition + 1 + indexes.length) % indexes.length];
      }
      playTrack(nextIndex);
    }

    function playPrevious() {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }

      const indexes = getActiveTrackIndexes();
      if (indexes.length === 0) return;
      const currentPosition = indexes.indexOf(currentTrackIndex);
      const previousPosition = currentPosition <= 0 ? indexes.length - 1 : currentPosition - 1;
      playTrack(indexes[previousPosition]);
    }

    function togglePlayPause() {
      if (currentTrackIndex < 0) {
        const firstTrack = getActiveTrackIndexes()[0];
        if (firstTrack === undefined) {
          showToast(text().noSongs);
          return;
        }
        playTrack(firstTrack);
        return;
      }

      if (audio.paused) {
        audio.play().catch(() => showToast(text().playbackError));
      } else {
        audio.pause();
      }
      updatePlayerDisplay();
    }

    /* =====================================================================
       Event listeners
       ===================================================================== */
    document.querySelectorAll("[data-category]").forEach(button => {
      button.addEventListener("click", () => {
        activeCategory = button.dataset.category;
        renderInterface();
      });
    });

    document.querySelectorAll("[data-mode]").forEach(button => {
      button.addEventListener("click", () => {
        playbackMode = button.dataset.mode;
        renderInterface();
      });
    });

    document.getElementById("langToggle").addEventListener("click", () => {
      interfaceLanguage = interfaceLanguage === "zh" ? "en" : "zh";
      renderInterface();
    });

    document.getElementById("playBtn").addEventListener("click", togglePlayPause);
    document.getElementById("prevBtn").addEventListener("click", playPrevious);
    document.getElementById("nextBtn").addEventListener("click", playNext);

    document.getElementById("shuffleBtn").addEventListener("click", () => {
      playbackMode = playbackMode === "shuffle" ? "all" : "shuffle";
      renderInterface();
    });

    document.getElementById("repeatBtn").addEventListener("click", () => {
      playbackMode = playbackMode === "one" ? "all" : "one";
      renderInterface();
    });

    document.getElementById("seek").addEventListener("input", event => {
      if (audio.duration) audio.currentTime = (Number(event.target.value) / 100) * audio.duration;
    });

    document.getElementById("volume").addEventListener("input", event => {
      masterVolume = Number(event.target.value);
      applyTrackVolume();
    });

    audio.addEventListener("timeupdate", updateProgress);
    audio.addEventListener("loadedmetadata", () => {
      if (currentTrackIndex >= 0) {
        trackCatalog[currentTrackIndex].duration = audio.duration;
        renderTrackList();
      }
      updateProgress();
    });
    audio.addEventListener("ended", playNext);
    audio.addEventListener("play", () => {
      updatePlayerDisplay();
      renderTrackList();
    });
    audio.addEventListener("pause", () => {
      updatePlayerDisplay();
      renderTrackList();
    });
    audio.addEventListener("error", () => {
      if (currentTrackIndex >= 0) showToast(text().playbackError);
    });

    /* Initialize the interface and default master volume. */
    // Keep the media element at 1; Web Audio handles master and per-track gain.
    applyTrackVolume();
    document.getElementById("volume").value = masterVolume;
    renderInterface();
  </script>
